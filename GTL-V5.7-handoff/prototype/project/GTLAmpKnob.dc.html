<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>GTLAmpKnob</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/guitar-theory-lab/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
body{margin:0}
.ga-wrap{display:inline-flex;flex-direction:column;aliga-items:center;gap:4px}
.ga-cap{font:600 12px/14px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted,#a79f8f);text-align:center}
.ga-area{position:relative;flex:none}
.ga-tick{position:absolute;inset:0;pointer-events:none}
.ga-tick i{position:absolute;left:50%;top:1px;width:2px;height:5px;margin-left:-1px;background:var(--ink-muted,#a79f8f);border-radius:1px}
.ga-tick[data-major="1"] i{height:8px;background:var(--ink-primary,#f2ead8)}
.ga-knob{position:absolute;padding:0;margin:0;border:0;cursor:ns-resize;border-radius:var(--radius-knob,50%);touch-action:none;background:transparent}
.ga-knob:focus-visible{outline:2px solid var(--focus-ring,#ffd23f);outline-offset:3px}
.ga-skirt{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 50% 28%,#f4ecd4 0%,#d9cfae 55%,#a89c78 100%);box-shadow:0 0 0 1px #2a2418,inset 0 -3px 5px rgba(60,40,10,.45),inset 0 2px 2px rgba(255,255,255,.8),0 3px 6px rgba(0,0,0,.55)}
.ga-knob:hover .ga-skirt{filter:brightness(1.1)}
.ga-knob:active .ga-skirt{box-shadow:0 0 0 1px #08090a,var(--shadow-inset,inset 0 1px 2px rgba(0,0,0,.6))}
.ga-cap2{position:absolute;left:22%;top:22%;width:56%;height:56%;border-radius:50%;pointer-events:none;background:repeating-conic-gradient(rgba(60,40,10,.18) 0deg 2deg,rgba(255,255,255,0) 2deg 8deg),radial-gradient(circle at 50% 30%,#efe5c6,#c9bd97);box-shadow:inset 0 0 0 1px rgba(42,36,24,.5),inset 0 1px 1px rgba(255,255,255,.7)}
.ga-ind{position:absolute;inset:0;pointer-events:none}
.ga-ind i{position:absolute;left:50%;top:7%;width:3px;height:30%;margin-left:-1.5px;background:#2a2418;border-radius:1px}
.ga-lcd{display:inline-flex;aliga-items:center;justify-content:center;min-width:58px;height:22px;padding:0 6px;box-sizing:border-box;border-radius:var(--radius-sm,2px);
  background:var(--lcd-glass,#06131f);color:var(--lcd-blue,#4fb2ff);box-shadow:var(--shadow-inset,inset 0 1px 2px rgba(0,0,0,.6)),0 0 0 1px #0a0b0d;
  font:500 12px/16px "IBM Plex Mono",ui-monospace,monospace;text-shadow:0 0 2px rgba(79,178,255,.65);white-space:nowrap}
</style>
</helmet>
<div class="ga-wrap">
<sc-if value="{{hasCap}}" hint-placeholder-val="{{true}}"><span class="ga-cap">{{caption}}</span></sc-if>
<div style="display:flex;aliga-items:center;gap:6px;flex-direction:{{dir}}">
<div class="ga-area" style="width:{{area}}px;height:{{area}}px">
<sc-for list="{{ticks}}" as="t" hint-placeholder-count="11"><span class="ga-tick" data-major="{{t.major}}" style="transform:rotate({{t.deg}}deg)"><i></i></span></sc-for>
<button type="button" class="ga-knob" role="slider" aria-label="{{aria}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{val}}" aria-valuetext="{{readout}}" onPointerDown="{{down}}" onPointerMove="{{move}}" onPointerUp="{{up}}" onPointerCancel="{{up}}" onKeyDown="{{key}}" onDoubleClick="{{reset}}" style="width:{{size}}px;height:{{size}}px;left:{{off}}px;top:{{off}}px">
<span class="ga-skirt"></span><span class="ga-cap2"></span><span class="ga-ind" style="transform:rotate({{angle}}deg)"><i></i></span>
</button>
</div>
<sc-if value="{{showRead}}" hint-placeholder-val="{{true}}"><span class="ga-lcd">{{readout}}</span></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"caption":{"editor":"text","default":"Input gain"},"value":{"editor":"range","default":62,"min":0,"max":100,"step":1},"size":{"editor":"enum","default":56,"options":[28,40,56]},"readout":{"editor":"text","default":"+12 dB"},"readoutPos":{"editor":"enum","default":"below","options":["below","right","none"]},"defaultValue":{"editor":"int","default":50},"a11y":{"editor":"text","default":"Input gain"},"onChange":{"editor":null},"$preview":{"width":120,"height":150}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: null }; this._d = null; }
  val() {
    const p = this.props;
    if (p.onChange) return p.value == null ? 50 : Number(p.value);
    return this.state.v != null ? this.state.v : (p.value == null ? 50 : Number(p.value));
  }
  set(v) {
    const n = Math.max(0, Math.min(100, Math.round(v)));
    if (this.props.onChange) this.props.onChange(n); else this.setState({ v: n });
  }
  renderVals() {
    const p = this.props;
    const size = Number(p.size) || 56;
    const pad = 12;
    const area = size + pad * 2;
    const v = this.val();
    const ticks = [];
    for (let i = 0; i < 11; i++) ticks.push({ deg: -135 + i * 27, major: (i === 0 || i === 5 || i === 10) ? '1' : '0' });
    const pos = p.readoutPos || 'below';
    const readout = p.readout != null && p.readout !== '' ? String(p.readout) : String(v);
    return {
      size, area, off: pad, ticks, val: v,
      angle: -135 + v * 2.7,
      caption: p.caption || '', hasCap: !!p.caption,
      aria: p.a11y || p.caption || 'Manopola',
      readout, showRead: pos !== 'none',
      dir: pos === 'right' ? 'row' : 'column',
      down: (e) => { this._d = { y: e.clientY, v: this.val() }; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (x) {} },
      move: (e) => { if (!this._d) return; this.set(this._d.v + (this._d.y - e.clientY) * 0.7); },
      up: (e) => { this._d = null; try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (x) {} },
      key: (e) => {
        const st = e.shiftKey ? 10 : 1; let v2 = this.val();
        if (e.key === 'ArrowUp' || e.key === 'ArrowRight') v2 += st;
        else if (e.key === 'ArrowDown' || e.key === 'ArrowLeft') v2 -= st;
        else if (e.key === 'Home') v2 = 0;
        else if (e.key === 'End') v2 = 100;
        else return;
        e.preventDefault(); this.set(v2);
      },
      reset: () => this.set(p.defaultValue == null ? 50 : Number(p.defaultValue))
    };
  }
}
</script>
</body>
</html>
