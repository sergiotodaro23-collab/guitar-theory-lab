<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>GTLKey</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/guitar-theory-lab/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&display=swap">
<style>
body{margin:0}
.gk-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:4px;font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.gk-cap{font:600 11px/13px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted,#a79f8f);text-align:center;max-width:76px}
.gk{position:relative;display:flex;align-items:center;justify-content:center;padding:0;margin:0;cursor:pointer;
  color:var(--ink-primary,#f2ead8);
  border:1px solid #0b0c0e;border-radius:var(--radius-md,6px);
  background:linear-gradient(180deg,#464a51 0%,var(--metal-dark,#2b2d31) 52%,#1f2024 100%);
  box-shadow:inset 0 1px 0 rgba(245,247,250,.30),inset 0 -2px 0 rgba(0,0,0,.35),var(--shadow-contact,0 1px 1px rgba(0,0,0,.5),0 3px 6px rgba(0,0,0,.35));
  font:600 11px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.08em;text-transform:uppercase}
.gk:hover{filter:brightness(1.12)}
.gk:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(245,247,250,.18),inset 0 1px 3px rgba(0,0,0,.5),0 1px 1px rgba(0,0,0,.5)}
.gk:focus-visible{outline:2px solid var(--focus-ring,#ffd23f);outline-offset:2px}
.gk[data-on="1"]{color:var(--paper-ink,#2a2418);
  background:linear-gradient(180deg,#ff9a5c 0%,var(--accent-orange,#f26b1d) 55%,#c94e12 100%);
  transform:translateY(1px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.25),0 1px 1px rgba(0,0,0,.55)}
.gk-led{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:var(--radius-knob,50%);background:#16221a;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.gk-led[data-lit="1"]{background:var(--led-green,#7dff6a);box-shadow:0 0 6px var(--led-green,#7dff6a),inset 0 0 0 1px rgba(0,0,0,.35)}
</style>
</helmet>
<div class="gk-wrap">
<sc-if value="{{capTop}}" hint-placeholder-val="{{true}}"><span class="gk-cap">{{caption}}</span></sc-if>
<button type="button" class="gk" aria-label="{{aria}}" aria-pressed="{{pressed}}" data-on="{{on}}" onClick="{{press}}" style="width:{{w}}px;height:{{h}}px">
<sc-if value="{{hasLed}}" hint-placeholder-val="{{false}}"><span class="gk-led" data-lit="{{ledLit}}"></span></sc-if>
<sc-if value="{{hasIcon}}" hint-placeholder-val="{{true}}">
<svg width="{{iconPx}}" height="{{iconPx}}" viewBox="0 0 24 24" aria-hidden="true" style="display:block"><path d="{{d}}" style="fill:{{fillv}};stroke:{{strokev}};stroke-width:2;stroke-linecap:round;stroke-linejoin:round"></path></svg>
</sc-if>
<sc-if value="{{hasText}}" hint-placeholder-val="{{false}}"><span>{{text}}</span></sc-if>
</button>
<sc-if value="{{capBottom}}" hint-placeholder-val="{{false}}"><span class="gk-cap">{{caption}}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"caption":{"editor":"text","default":"Play"},"captionPos":{"editor":"enum","default":"top","options":["top","bottom"]},"icon":{"editor":"enum","default":"play","options":["","play","pause","stop","loop","plus","minus","up","down","tuner","nam","monitor","gear","save","help","folder","clipboard"]},"text":{"editor":"text","default":""},"size":{"editor":"enum","default":"transport","options":["mini","std","transport","square"]},"active":{"editor":"boolean","default":true},"toggle":{"editor":"boolean","default":true},"led":{"editor":"boolean","default":true},"a11y":{"editor":"text","default":"Play"},"onPress":{"editor":null},"$preview":{"width":120,"height":86}}'>
const GTL_ICONS = {
  play: 'M7 4.5v15l12.5-7.5z',
  pause: 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z',
  stop: 'M6.5 6.5h11v11h-11z',
  loop: 'M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3',
  plus: 'M12 5v14M5 12h14',
  minus: 'M5 12h14',
  up: 'M6 15l6-6 6 6',
  down: 'M6 9l6 6 6-6',
  tuner: 'M8 3v8a4 4 0 0 0 8 0V3M12 15v6',
  nam: 'M4 12h.01M8 8v8M12 4v16M16 8v8M20 12h.01',
  monitor: 'M4 15v-3a8 8 0 0 1 16 0v3M4 15a2 2 0 0 1 2-2h1v7H6a2 2 0 0 1-2-2zM20 15a2 2 0 0 0-2-2h-1v7h1a2 2 0 0 0 2-2z',
  gear: 'M15 12a3 3 0 1 1-6 0a3 3 0 0 1 6 0zM12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1',
  save: 'M5 3h11l3 3v15H5zM8 3v6h7V3M8 21v-7h8v7',
  help: 'M21 12a9 9 0 1 1-18 0a9 9 0 0 1 18 0zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17.4h.01',
  folder: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  clipboard: 'M8 4h8a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM9 4V3h6v1M9 10h6M9 14h6',
  expand: 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5',
  collapse: 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5'
};
const GTL_FILLED = { play: 1, pause: 1, stop: 1 };
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const sizes = { mini: [34, 24], std: [40, 32], transport: [44, 34], square: [52, 52] };
    const sz = sizes[p.size] || sizes.transport;
    const w = Number(p.w) || sz[0];
    const h = Number(p.h) || sz[1];
    const icon = p.icon || '';
    const hasIcon = !!GTL_ICONS[icon];
    const on = !!p.active;
    const pos = p.captionPos === 'bottom' ? 'bottom' : 'top';
    const caption = p.caption || '';
    return {
      w, h, on: on ? '1' : '0',
      pressed: p.toggle ? (on ? 'true' : 'false') : undefined,
      aria: p.a11y || caption || p.text || icon,
      caption,
      capTop: !!caption && pos === 'top',
      capBottom: !!caption && pos === 'bottom',
      hasLed: !!p.led,
      ledLit: p.led && on ? '1' : '0',
      hasIcon,
      iconPx: p.size === 'square' ? 24 : 18,
      d: GTL_ICONS[icon] || '',
      fillv: GTL_FILLED[icon] ? 'currentColor' : 'none',
      strokev: GTL_FILLED[icon] ? 'none' : 'currentColor',
      hasText: !hasIcon && !!p.text,
      text: p.text || '',
      press: () => { if (this.props.onPress) this.props.onPress(); }
    };
  }
}
</script>
</body>
</html>
