<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>GTLMarker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/guitar-theory-lab/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0}
.gm{position:relative;container-type:inline-size;display:block}
.gm svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.gm-t{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:600;line-height:1;color:var(--paper-ink,#2a2418);pointer-events:none}
@keyframes gm-pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.gm-pl{animation:gm-pulse 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.gm-pl{animation:none}}
</style>
</helmet>
<div class="gm" style="width:{{w}};height:{{h}}">
<svg viewBox="0 0 40 40" role="img" aria-label="{{aria}}">
<path d="{{ringRootD}}" style="{{rootOuter}}"></path>
<circle cx="20" cy="20" r="16.1" style="{{rootInner}}"></circle>
<circle cx="20" cy="20" r="19" style="{{targetUnder}}"></circle>
<circle cx="20" cy="20" r="19" style="{{targetDash}}"></circle>
<circle class="{{plCls}}" cx="20" cy="20" r="18.4" style="{{playRing}}"></circle>
<circle class="{{plCls}}" cx="20" cy="20" r="17.6" style="{{detRing}}"></circle>
<circle cx="20" cy="22" r="17" style="{{glowUnder}}"></circle>
<circle cx="20" cy="20" r="18.6" style="{{seqRing}}"></circle>
<path d="{{baseD}}" style="{{baseStyle}}"></path>
<rect x="4.2" y="4.2" width="31.6" height="31.6" rx="7" style="{{cringStyle}}"></rect>
<rect x="11" y="11" width="18" height="18" rx="4.5" style="{{guideStyle}}"></rect>
<line x1="9.2" y1="30.8" x2="30.8" y2="9.2" style="{{avoidStyle}}"></line>
<rect x="9" y="37.4" width="22" height="2.8" rx="1.4" style="{{sb0}}"></rect>
<rect x="9" y="40.8" width="22" height="2.8" rx="1.4" style="{{sb1}}"></rect>
<rect x="9" y="44.2" width="22" height="2.8" rx="1.4" style="{{sb2}}"></rect>
<rect x="9" y="-0.2" width="22" height="2.8" rx="1.4" style="{{cb0}}"></rect>
<rect x="9" y="-3.6" width="22" height="2.8" rx="1.4" style="{{cb1}}"></rect>
<rect x="9" y="-7" width="22" height="2.8" rx="1.4" style="{{cb2}}"></rect>
<circle cx="31.6" cy="8.6" r="3" style="{{sl0}}"></circle>
<circle cx="35.6" cy="13.6" r="3" style="{{sl1}}"></circle>
<circle cx="27" cy="4.9" r="3" style="{{sl2}}"></circle>
<rect x="29" y="29" width="5.6" height="5.6" rx="1.4" style="{{cl0}}"></rect>
<rect x="33.4" y="24" width="5.6" height="5.6" rx="1.4" style="{{cl1}}"></rect>
<rect x="24" y="33.4" width="5.6" height="5.6" rx="1.4" style="{{cl2}}"></rect>
</svg>
<span class="gm-t" aria-hidden="true" style="font-size:{{fs}};text-shadow:{{halo}}">{{label}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","default":"scale","options":["tonic","scale","chord","tension","external"]},"label":{"editor":"text","default":"C"},"size":{"editor":"int","default":44,"min":14,"max":96},"fill":{"editor":"boolean","default":false},"chordRoot":{"editor":"boolean","default":false},"guide":{"editor":"boolean","default":false},"avoid":{"editor":"boolean","default":false},"outside":{"editor":"boolean","default":false},"target":{"editor":"boolean","default":false},"playing":{"editor":"boolean","default":false},"detected":{"editor":"boolean","default":false},"sl":{"editor":"text","default":""},"cring":{"editor":"boolean","default":false},"seq":{"editor":"boolean","default":false},"lstyle":{"editor":"enum","default":"bars","options":["bars","dots"]},"anim":{"editor":"enum","default":"pulse","options":["pulse","glow","static"]},"cl":{"editor":"text","default":""},"$preview":{"width":72,"height":72}}'>
const GM_NAMES = { tonic: 'Tonica', scale: 'Nota della scala', chord: 'Nota dell\'accordo', tension: 'Tensione', external: 'Fuori scala' };
function gmCircle(r) { return 'M' + (20 - r) + ' 20a' + r + ' ' + r + ' 0 1 0 ' + (2 * r) + ' 0a' + r + ' ' + r + ' 0 1 0 ' + (-2 * r) + ' 0z'; }
function gmSquare(h, r) { const a = 20 - h, b = 20 + h; return 'M' + (a + r) + ' ' + a + 'H' + (b - r) + 'A' + r + ' ' + r + ' 0 0 1 ' + b + ' ' + (a + r) + 'V' + (b - r) + 'A' + r + ' ' + r + ' 0 0 1 ' + (b - r) + ' ' + b + 'H' + (a + r) + 'A' + r + ' ' + r + ' 0 0 1 ' + a + ' ' + (b - r) + 'V' + (a + r) + 'A' + r + ' ' + r + ' 0 0 1 ' + (a + r) + ' ' + a + 'z'; }
const HID = 'display:none';
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const role = p.role || 'scale';
    const label = p.label == null ? '' : String(p.label);
    const px = Number(p.size) || 44;
    const fill = p.fill === true || p.fill === 'true';
    const ink = 'var(--paper-ink,#2a2418)';
    let baseD, baseStyle;
    if (role === 'tonic') { baseD = gmCircle(13.4); baseStyle = 'fill:var(--marker-tonic,#f08a24);stroke:' + ink + ';stroke-width:3.2'; }
    else if (role === 'chord') { baseD = gmSquare(12.2, 5.5); baseStyle = 'fill:var(--marker-chord,#3cc27a);stroke:' + ink + ';stroke-width:1.7'; }
    else if (role === 'tension') { baseD = 'M20 4.6L35.4 20L20 35.4L4.6 20z'; baseStyle = 'fill:var(--marker-tension,#a77bf0);stroke:' + ink + ';stroke-width:1.7;stroke-linejoin:round'; }
    else if (role === 'external') { baseD = gmCircle(11.6); baseStyle = 'fill:rgba(255,255,255,.34);stroke:var(--marker-external,#8a8a8a);stroke-width:2.4'; }
    else { baseD = gmCircle(13.6); baseStyle = 'fill:var(--marker-scale,#4a9fe8);stroke:' + ink + ';stroke-width:1.7'; }
    const on = (v) => v === true || v === 'true';
    const cols = (s) => String(s || '').split(',').filter(Boolean);
    const sl = cols(p.sl), cl = cols(p.cl);
    const bars = p.lstyle !== 'dots';
    const dotS = (c) => (c && !bars) ? 'fill:' + c + ';stroke:' + ink + ';stroke-width:1' : HID;
    const barS = (c) => (c && bars) ? 'fill:' + c + ';stroke:' + ink + ';stroke-width:.8' : HID;
    const anim = p.anim || 'pulse';
    const dotC = (c) => (c && !bars) ? 'fill:' + c + ';stroke:' + ink + ';stroke-width:1' : HID;
    const L = label.length;
    const names = [GM_NAMES[role] || role];
    if (on(p.chordRoot)) names.push('fondamentale dell\'accordo');
    if (on(p.guide)) names.push('guide tone');
    if (on(p.avoid)) names.push('da evitare');
    if (on(p.outside)) names.push('fuori dalla scala principale');
    if (on(p.target)) names.push('bersaglio dell\'esercizio');
    if (on(p.playing)) names.push('in esecuzione');
    if (on(p.detected)) names.push('rilevata dall\'ingresso');
    if (on(p.cring)) names.push('anche nota dell\'accordo');
    if (on(p.seq)) names.push('nella sequenza dell\'esercizio');
    return {
      w: fill ? '100%' : px + 'px', h: fill ? '100%' : px + 'px',
      aria: names.join(', ') + (label ? ' ' + label : ''),
      label, fs: L > 2 ? '21cqw' : (L === 2 ? '26cqw' : '31cqw'),
      halo: on(p.avoid) ? '0 0 2px #ff5a5f,0 0 2px #ff5a5f' : 'none',
      baseD, baseStyle: baseStyle + (on(p.outside) && role !== 'external' ? ';stroke-dasharray:3.2 2.2' : ''),
      ringRootD: gmCircle(17.5),
      rootOuter: on(p.chordRoot) ? 'fill:none;stroke:' + ink + ';stroke-width:1.5' : HID,
      rootInner: on(p.chordRoot) ? 'fill:none;stroke:#fff;stroke-width:1.7' : HID,
      targetUnder: on(p.target) ? 'fill:none;stroke:#fff;stroke-width:4;opacity:.9' : HID,
      targetDash: on(p.target) ? 'fill:none;stroke:#1b1712;stroke-width:2;stroke-dasharray:3.4 2.8' : HID,
      playRing: on(p.playing) && anim !== 'glow' ? 'fill:none;stroke:var(--accent-orange,#f26b1d);stroke-width:3;filter:drop-shadow(0 0 3px #f26b1d)' : HID,
      plCls: anim === 'pulse' ? 'gm-pl' : 'gm-st',
      glowUnder: (anim === 'glow' && (on(p.playing) || on(p.detected))) ? 'fill:' + (on(p.playing) ? 'rgba(242,107,29,.55)' : 'rgba(79,178,255,.55)') + ';filter:blur(3px)' : HID,
      seqRing: on(p.seq) ? 'fill:none;stroke:#fff8e6;stroke-width:1.3;opacity:.9' : HID,
      cringStyle: on(p.cring) ? 'fill:none;stroke:var(--marker-chord,#3cc27a);stroke-width:2.6' : HID,
      sb0: barS(sl[0]), sb1: barS(sl[1]), sb2: barS(sl[2]), cb0: barS(cl[0]), cb1: barS(cl[1]), cb2: barS(cl[2]),
      detRing: on(p.detected) && anim !== 'glow' ? 'fill:none;stroke:var(--lcd-blue,#4fb2ff);stroke-width:2.8;filter:drop-shadow(0 0 3px #4fb2ff)' : HID,
      guideStyle: on(p.guide) ? 'fill:none;stroke:' + ink + ';stroke-width:1.4' : HID,
      avoidStyle: on(p.avoid) ? 'stroke:' + ink + ';stroke-width:3;stroke-linecap:round' : HID,
      sl0: dotS(sl[0]), sl1: dotS(sl[1]), sl2: dotS(sl[2]),
      cl0: dotC(cl[0]), cl1: dotC(cl[1]), cl2: dotC(cl[2])
    };
  }
}
</script>
</body>
</html>
